x-production-backend-environment: &production-backend-environment
  PROBEINTERVIEW_ENVIRONMENT: production
  PROBEINTERVIEW_DATABASE_URL: "${PROBEINTERVIEW_DATABASE_URL:?set PROBEINTERVIEW_DATABASE_URL}"
  PROBEINTERVIEW_CELERY_BROKER_URL: "${PROBEINTERVIEW_CELERY_BROKER_URL:?set PROBEINTERVIEW_CELERY_BROKER_URL}"
  PROBEINTERVIEW_LOCAL_ACTOR_ENABLED: "false"
  PROBEINTERVIEW_FOUNDATION_PROBE_ENABLED: "false"
  PROBEINTERVIEW_OBJECT_STORAGE_ADAPTER: oss
  PROBEINTERVIEW_EMBEDDING_ADAPTER: bailian
  PROBEINTERVIEW_STRUCTURED_LLM_ADAPTER: bailian
  PROBEINTERVIEW_OSS_ENDPOINT: "${PROBEINTERVIEW_OSS_ENDPOINT:?set PROBEINTERVIEW_OSS_ENDPOINT}"
  PROBEINTERVIEW_OSS_BUCKET: "${PROBEINTERVIEW_OSS_BUCKET:?set PROBEINTERVIEW_OSS_BUCKET}"
  PROBEINTERVIEW_OSS_ACCESS_KEY_ID: "${PROBEINTERVIEW_OSS_ACCESS_KEY_ID:?set PROBEINTERVIEW_OSS_ACCESS_KEY_ID}"
  PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET: "${PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET:?set PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET}"
  PROBEINTERVIEW_BAILIAN_API_KEY: "${PROBEINTERVIEW_BAILIAN_API_KEY:?set PROBEINTERVIEW_BAILIAN_API_KEY}"

services:
  caddy:
    environment:
      PROBEINTERVIEW_DOMAIN: "${PROBEINTERVIEW_DOMAIN:?set PROBEINTERVIEW_DOMAIN}"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  api:
    environment: *production-backend-environment

  worker:
    environment: *production-backend-environment

  postgres:
    environment:
      POSTGRES_PASSWORD: "${PROBEINTERVIEW_POSTGRES_PASSWORD:?set PROBEINTERVIEW_POSTGRES_PASSWORD}"

volumes:
  caddy-data:
  caddy-config:
