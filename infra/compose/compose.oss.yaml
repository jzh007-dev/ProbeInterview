x-oss-environment: &oss-environment
  PROBEINTERVIEW_OBJECT_STORAGE_ADAPTER: oss
  PROBEINTERVIEW_OSS_ENDPOINT: "${PROBEINTERVIEW_OSS_ENDPOINT:?set PROBEINTERVIEW_OSS_ENDPOINT}"
  PROBEINTERVIEW_OSS_BUCKET: "${PROBEINTERVIEW_OSS_BUCKET:?set PROBEINTERVIEW_OSS_BUCKET}"
  PROBEINTERVIEW_OSS_ACCESS_KEY_ID: "${PROBEINTERVIEW_OSS_ACCESS_KEY_ID:?set PROBEINTERVIEW_OSS_ACCESS_KEY_ID}"
  PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET: "${PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET:?set PROBEINTERVIEW_OSS_ACCESS_KEY_SECRET}"

services:
  api:
    environment: *oss-environment

  worker:
    environment: *oss-environment

  database-initializer:
    environment: *oss-environment
