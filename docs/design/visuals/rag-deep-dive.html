      &lt;div class=&quot;rag-relation&quot;&gt;&lt;strong&gt;互补&lt;/strong&gt;&lt;span class=&quot;rag-muted&quot;&gt;组合成更完整问题&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;rag-relation&quot;&gt;&lt;strong&gt;无关&lt;/strong&gt;&lt;span class=&quot;rag-muted&quot;&gt;分别保留或过滤&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;rag-section-label&quot; style=&quot;margin-top:14px&quot;&gt;3. 从候选内容到面试问题&lt;/p&gt;
    &lt;div class=&quot;rag-pipeline&quot;&gt;
      &lt;div class=&quot;rag-pipeline-row&quot;&gt;
        &lt;article class=&quot;rag-node decision&quot;&gt;
          &lt;div class=&quot;rag-node-head&quot;&gt;
            &lt;strong&gt;冲突裁决&lt;/strong&gt;
            &lt;span class=&quot;rag-chip confirmed&quot;&gt;MVP 规则&lt;/span&gt;
          &lt;/div&gt;
          &lt;p&gt;公共知识为默认评分基准；私人知识用于个性化，不可静默覆盖公共标准。&lt;/p&gt;
        &lt;/article&gt;
        &lt;i class=&quot;rag-arrow&quot;&gt;→&lt;/i&gt;
        &lt;article class=&quot;rag-node processing&quot;&gt;
          &lt;div class=&quot;rag-node-head&quot;&gt;
            &lt;strong&gt;受控候选池&lt;/strong&gt;
            &lt;span class=&quot;rag-chip confirmed&quot;&gt;仅允许有效 ID&lt;/span&gt;
          &lt;/div&gt;
          &lt;p&gt;候选题携带知识点、来源、版本、年限、评分要点和冲突状态。&lt;/p&gt;
        &lt;/article&gt;
        &lt;i class=&quot;rag-arrow&quot;&gt;→&lt;/i&gt;
        &lt;article class=&quot;rag-node processing&quot;&gt;
          &lt;div class=&quot;rag-node-head&quot;&gt;
            &lt;strong&gt;LLM 结构化选题&lt;/strong&gt;
            &lt;span class=&quot;rag-chip confirmed&quot;&gt;Schema 校验&lt;/span&gt;
          &lt;/div&gt;
          &lt;p&gt;模型只能选择候选 ID；服务端拒绝幻觉 ID、越权 ID 和结构错误。&lt;/p&gt;
        &lt;/article&gt;
        &lt;i class=&quot;rag-arrow&quot;&gt;→&lt;/i&gt;
        &lt;article class=&quot;rag-node storage&quot;&gt;
          &lt;div class=&quot;rag-node-head&quot;&gt;
            &lt;strong&gt;计划快照与 Trace&lt;/strong&gt;
            &lt;span class=&quot;rag-chip confirmed&quot;&gt;可复现&lt;/span&gt;
          &lt;/div&gt;
          &lt;p&gt;保存实际来源、检索结果、选择理由、模型和全部版本引用。&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;rag-footer&quot;&gt;
      &lt;strong&gt;关键原则：&lt;/strong&gt;
      向量相似只用于召回，不直接等于“同一知识”；公共与私人正文保持独立，通过 relation 关联，避免自动合并污染用户内容。
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;rag-data-panel&quot; class=&quot;rag-panel&quot; role=&quot;tabpanel&quot; hidden&gt;
    &lt;p class=&quot;rag-section-label&quot;&gt;核心数据模型&lt;/p&gt;
    &lt;div class=&quot;rag-schema-grid&quot;&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;knowledge_node&lt;/strong&gt;
        &lt;p&gt;公共技术主题与稳定知识点。&lt;/p&gt;
        &lt;code&gt;stable_id · parent_id · content_version&lt;/code&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;private_knowledge_node&lt;/strong&gt;
        &lt;p&gt;用户私人知识点，不自动发布到公共库。&lt;/p&gt;
        &lt;code&gt;owner_user_id · source_key · document_id&lt;/code&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;knowledge_chunk&lt;/strong&gt;
        &lt;p&gt;可检索正文与层级上下文。&lt;/p&gt;
        &lt;code&gt;source_type · source_id · text · metadata&lt;/code&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;embedding_record&lt;/strong&gt;
        &lt;p&gt;向量与生成它的版本信息。&lt;/p&gt;
        &lt;code&gt;chunk_id · vector · embedding_version · dimension&lt;/code&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;knowledge_relation&lt;/strong&gt;
        &lt;p&gt;公共与私人内容的语义关系，不合并原文。&lt;/p&gt;
        &lt;code&gt;left_id · right_id · relation · confidence&lt;/code&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-schema&quot;&gt;
        &lt;strong&gt;retrieval_run&lt;/strong&gt;
        &lt;p&gt;一次检索、融合、重排和选题的可追踪记录。&lt;/p&gt;
        &lt;code&gt;query · candidate_ids · scores · versions&lt;/code&gt;
      &lt;/article&gt;
    &lt;/div&gt;

    &lt;p class=&quot;rag-section-label&quot; style=&quot;margin-top:14px&quot;&gt;必须守住的设计约束&lt;/p&gt;
    &lt;div class=&quot;rag-decision-grid&quot;&gt;
      &lt;article class=&quot;rag-decision&quot;&gt;
        &lt;strong&gt;Tenant Filter First&lt;/strong&gt;
        &lt;span class=&quot;rag-muted&quot;&gt;向量召回之前即限制 owner_user_id，避免跨用户候选进入内存。&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-decision&quot;&gt;
        &lt;strong&gt;Immutable Versions&lt;/strong&gt;
        &lt;span class=&quot;rag-muted&quot;&gt;历史面试始终引用当时的内容、Embedding 与模型版本。&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-decision&quot;&gt;
        &lt;strong&gt;No Silent Merge&lt;/strong&gt;
        &lt;span class=&quot;rag-muted&quot;&gt;相似内容建立关系，不覆盖用户原文，也不自动发布为公共内容。&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-decision&quot;&gt;
        &lt;strong&gt;Re-embedding&lt;/strong&gt;
        &lt;span class=&quot;rag-muted&quot;&gt;新旧向量并存构建，验证通过后原子切换当前版本。&lt;/span&gt;
      &lt;/article&gt;
    &lt;/div&gt;

    &lt;p class=&quot;rag-section-label&quot; style=&quot;margin-top:14px&quot;&gt;离线评测与上线门槛&lt;/p&gt;
    &lt;div class=&quot;rag-metric-grid&quot;&gt;
      &lt;article class=&quot;rag-metric&quot;&gt;
        &lt;strong&gt;Recall@K&lt;/strong&gt;
        &lt;span&gt;正确知识点是否进入候选集&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-metric&quot;&gt;
        &lt;strong&gt;MRR / nDCG&lt;/strong&gt;
        &lt;span&gt;正确结果是否排在前列&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-metric&quot;&gt;
        &lt;strong&gt;Duplicate F1&lt;/strong&gt;
        &lt;span&gt;重复与改写识别准确性&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-metric&quot;&gt;
        &lt;strong&gt;Conflict P/R&lt;/strong&gt;
        &lt;span&gt;冲突识别准确率与召回率&lt;/span&gt;
      &lt;/article&gt;
      &lt;article class=&quot;rag-metric&quot;&gt;
        &lt;strong&gt;Latency / Cost&lt;/strong&gt;
        &lt;span&gt;检索、重排和模型成本预算&lt;/span&gt;
      &lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rag-footer&quot;&gt;
      &lt;strong&gt;参数策略：&lt;/strong&gt;
      Chunk 大小、重叠率、Embedding 维度、Top-K、融合权重、Rerank 数量和冲突阈值均由固定评测集确定，不在架构中拍脑袋写死。
    &lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;probe-rag-deep-v1&quot;);
    const tabs = root.querySelectorAll(&quot;.rag-tab&quot;);
    const panels = root.querySelectorAll(&quot;.rag-panel&quot;);

    tabs.forEach((tab) =&gt; {
      tab.addEventListener(&quot;click&quot;, () =&gt; {
        tabs.forEach((item) =&gt; item.setAttribute(&quot;aria-selected&quot;, &quot;false&quot;));
        panels.forEach((panel) =&gt; {
          panel.hidden = true;
        });
        tab.setAttribute(&quot;aria-selected&quot;, &quot;true&quot;);
        root.querySelector(`#${tab.getAttribute(&quot;aria-controls&quot;)}`).hidden = false;
      });
    });
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
